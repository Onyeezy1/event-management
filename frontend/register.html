<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Event Management</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <h2>Register</h2>

  <form id="registerForm">
    <input type="text" id="name" placeholder="Full Name" required><br><br>
    <input type="email" id="email" placeholder="Email" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>
    <select id="role" required>
      <option value="">Select Role</option>
      <option value="attendee">Attendee</option>
      <option value="organizer">Organizer</option>
    </select><br><br>
    <button type="submit">Register</button>
  </form>

  <p id="status" style="color: red;"></p>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const statusText = document.getElementById('status');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusText.textContent = "Sending request...";

        const payload = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.getElementById('role').value,
        };

        try {
          const res = await fetch('https://event-backend-jjpt.onrender.com/api/auth/register', {

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await res.json();

          if (res.ok) {
            alert('Registration successful! Redirecting to login...');
            window.location.href = "login.html";
          } else {
            statusText.textContent = data.error || 'Registration failed.';
          }
        } catch (err) {
          console.error('Error:', err);
          statusText.textContent = 'Network or server error.';
        }
      });
    });
  </script>
</body>
</html>
